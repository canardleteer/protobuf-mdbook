[workspace]
resolver = "3"
members = [".", "xtask"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/canardleteer/protobuf-mdbook"
homepage = "https://github.com/canardleteer/protobuf-mdbook"
documentation = "https://github.com/canardleteer/protobuf-mdbook#readme"
readme = "README.md"
description = "protobuf-mdbook CLI and protoc-gen-mdbook plugin: schema documentation as mdBook projects or Markdown."
keywords = ["protoc", "protobuf", "mdbook", "markdown", "documentation"]
categories = ["development-tools", "command-line-utilities"]

# CI / Pages toolchain pins (mdbook CLI matches mdbook-core below).
[workspace.metadata.protobuf-mdbook.toolchain]
buf = "1.69.0"
mdbook-mermaid = "0.17.0"

[workspace.dependencies]
anyhow = "1.0"
buffa = { version = "0.6.0", default-features = false, features = ["std"] }
buffa-descriptor = { version = "0.6.0", default-features = false, features = ["std"] }
mdbook-core = "=0.5.3"
mdbook-driver = "=0.5.3"
mdbook-summary = "=0.5.3"
mdbook-preprocessor = "=0.5.3"
pulldown-cmark = "0.13"
regex = "1.11"
toml_edit = "0.25"
tempfile = "3.19"
walkdir = "2.5"
protoc-bin-vendored = "3.2.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[package]
name = "protobuf-mdbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-mdbook"
path = "src/main.rs"

[[bin]]
name = "protobuf-mdbook"
path = "src/bin/protobuf-mdbook.rs"

[[bin]]
name = "mdbook-protobuf-highlight"
path = "src/bin/mdbook-protobuf-highlight.rs"

[dependencies]
anyhow.workspace = true
buffa.workspace = true
buffa-descriptor.workspace = true
clap.workspace = true
mdbook-core.workspace = true
mdbook-driver.workspace = true
mdbook-summary.workspace = true
mdbook-preprocessor.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
toml_edit.workspace = true
serde_json.workspace = true
protoc-bin-vendored.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[dev-dependencies]
buffa.workspace = true
buffa-descriptor.workspace = true
protoc-bin-vendored.workspace = true
tempfile.workspace = true
