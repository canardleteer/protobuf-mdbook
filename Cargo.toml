[workspace]
resolver = "3"
members = [".", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/canardleteer/protoc-gen-mdbook"
homepage = "https://github.com/canardleteer/protoc-gen-mdbook"
documentation = "https://github.com/canardleteer/protoc-gen-mdbook#readme"
readme = "README.md"
description = "protoc plugin: protobuf schema documentation as mdBook projects or Markdown."
keywords = ["protoc", "protobuf", "mdbook", "markdown", "documentation"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
buffa = { version = "0.6.0", default-features = false, features = ["std"] }
buffa-descriptor = { version = "0.6.0", default-features = false, features = ["std"] }
mdbook-core = "=0.5.3"
mdbook-driver = "=0.5.3"
mdbook-summary = "=0.5.3"
tempfile = "3.19"
walkdir = "2.5"
protoc-bin-vendored = "3.2.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[package]
name = "protoc-gen-mdbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-mdbook"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
buffa.workspace = true
buffa-descriptor.workspace = true
mdbook-core.workspace = true
mdbook-driver.workspace = true
mdbook-summary.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[dev-dependencies]
protoc-bin-vendored.workspace = true
tempfile.workspace = true
