version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # dtolnay/rust-toolchain@1.96.0 pins the compiler (matches rust-toolchain.toml),
    # not the action release. Dependabot semver-bumps the ref to nonsense like 1.100.0.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    # When `groups` is active, Dependabot opens one combined PR for all
    # matching GitHub Actions updates each week. Comment out the entire
    # `groups:` block below to revert to the default: one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - dtolnay/rust-toolchain
