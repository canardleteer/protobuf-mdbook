# CI: rustfmt, clippy, tests, and example generation via `cargo xtask ci`.
name: rust-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runs_on }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-amd64
            runs_on: ubuntu-latest
          - name: macos-arm64
            runs_on: macos-14
          - name: windows-amd64
            runs_on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Read toolchain versions from Cargo.toml
        uses: ./.github/actions/toolchain-versions
      - name: Cache Cargo registry and git
        uses: Swatinem/rust-cache@v2
        with:
          # Single workspace at repo root; default ". -> target" is correct.
          # shared-key lets ci/docker/pages reuse deps on the same host triple.
          shared-key: cargo
          cache-on-failure: true
          # Don't cache ~/.cargo/bin: rust-cache may strip binaries while
          # .crates2.json still marks cargo-install tools as present.
          cache-bin: false
      - name: Install Buf CLI
        uses: ./.github/actions/install-toolchain
      - name: cargo xtask ci
        run: cargo xtask ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and git
        uses: Swatinem/rust-cache@v2
        with:
          # Single workspace at repo root; default ". -> target" is correct.
          # shared-key lets ci/docker/pages reuse deps on the same host triple.
          shared-key: cargo
          cache-on-failure: true
          cache-bin: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: docker build and smoke test
        run: cargo xtask docker
