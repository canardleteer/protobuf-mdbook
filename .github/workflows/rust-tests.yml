# CI: rustfmt, clippy, tests, and example generation via `cargo xtask ci`.
name: rust-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runs_on }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-amd64
            runs_on: ubuntu-latest
          - name: macos-arm64
            runs_on: macos-14
          - name: windows-amd64
            runs_on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dsherret/rust-toolchain-file@v1
      - name: Install Buf CLI
        run: cargo install buf-toolchain --locked --version 1.69.0
      - name: cargo xtask ci
        run: cargo xtask ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dsherret/rust-toolchain-file@v1
      - uses: docker/setup-buildx-action@v3
      - name: docker build and smoke test
        run: cargo xtask docker
