# Publish example api-book to GitHub Pages on pushes to main.
name: pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build api-book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Read toolchain versions from Cargo.toml
        uses: ./.github/actions/toolchain-versions

      - name: Cache Cargo registry and git
        uses: Swatinem/rust-cache@v2
        with:
          # Single workspace at repo root; default ". -> target" is correct.
          # shared-key lets ci/docker/pages reuse deps on the same host triple.
          shared-key: cargo
          cache-on-failure: true
          # Don't cache ~/.cargo/bin: rust-cache may strip binaries while
          # .crates2.json still marks cargo-install tools as present.
          cache-bin: false

      - name: Install toolchain CLI
        uses: ./.github/actions/install-toolchain
        with:
          mdbook: true
          mdbook-mermaid: true

      - name: Generate example mdBook at ./api-book
        run: cargo xtask book-init

      - name: Check generated markdown links
        run: cargo xtask book-links

      - name: Configure Mermaid preprocessor
        run: mdbook-mermaid install api-book

      - name: Set GitHub Pages site URL
        run: |
          echo 'site-url = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"' >> api-book/book.toml

      - name: Build static HTML
        run: mdbook build api-book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: api-book/book

  deploy:
    name: deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
